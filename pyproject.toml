[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "erpnext_wms"
authors = [{name = "ERPNext WMS", email = "support@erpnext-wms.com"}]
description = "Complete Warehouse Management System for ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]

# frappe and erpnext are supplied by the bench, not by pip -- listing them here
# would make pip pull unrelated packages of the same name from PyPI. The hard
# dependency on ERPNext is declared via `required_apps` in hooks.py.
dependencies = []
